  <rect width="1440" height="920" fill="url(#bg)"/>

  <!-- Header -->
  <text x="48" y="58" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#0f172a">计算机科学学习体系 · 课程地图 v1</text>
  <text x="48" y="88" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15" fill="#475569">从零基础到硕士等效：六阶能力模型 × 23 门核心课 × 10 个专业方向 × 研究训练</text>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13" fill="#334155">
